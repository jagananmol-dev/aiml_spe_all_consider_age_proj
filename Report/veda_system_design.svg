<path d="M1375,902 V936 H175 V904" fill="none" stroke="#b4b2aa" stroke-width="1.8"  marker-end="url(#ah)"/>
<text x="775" y="928" class="e" text-anchor="middle">streamed answer with sources</text>
<text x="50" y="986" class="sec">Full mode swaps · Docker</text>
<rect x="50" y="1000" width="250" height="64" rx="10" fill="#fff" stroke="#c9c6bd" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="72" y="1027" class="t2">Kafka</text>
<text x="72" y="1049" class="s">replaces the Postgres queue</text>
<rect x="350" y="1000" width="250" height="64" rx="10" fill="#fff" stroke="#c9c6bd" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="372" y="1027" class="t2">MinIO</text>
<text x="372" y="1049" class="s">replaces .data/uploads</text>
<rect x="650" y="1000" width="250" height="64" rx="10" fill="#fff" stroke="#c9c6bd" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="672" y="1027" class="t2">Apache AGE</text>
<text x="672" y="1049" class="s">replaces graph tables</text>
<rect x="950" y="1000" width="250" height="64" rx="10" fill="#fff" stroke="#c9c6bd" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="972" y="1027" class="t2">pgvector HNSW</text>
<text x="972" y="1049" class="s">replaces REAL[] + numpy</text>
<rect x="1250" y="1000" width="250" height="64" rx="10" fill="#fff" stroke="#c9c6bd" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="1272" y="1027" class="t2">OpenSearch</text>
<text x="1272" y="1049" class="s">adds keyword search</text>
<text x="50" y="1092" class="foot">Every API query is tenant-scoped SQL. The graph only steers search, so every citation points at a real passage. Web → intelligence calls carry X-Internal-Key.</text>
</svg>