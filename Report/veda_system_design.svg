<svg xmlns="http://www.w3.org/2000/svg" width="1550" height="1100" viewBox="0 0 1550 1100">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#b4b2aa"/></marker>
<style>
text{font-family:"Segoe UI Variable Display","Segoe UI",Inter,Arial,sans-serif}
.title{font-size:25px;font-weight:600;fill:#111}
.sec{font-size:16px;font-weight:600;fill:#555}
.t{font-size:19px;font-weight:600;fill:#111}
