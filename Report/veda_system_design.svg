<text x="637" y="202" class="e">HTTPS · session cookie</text>
<path d="M22,212 V852 H50" fill="none" stroke="#b4b2aa" stroke-width="1.8"  marker-end="url(#ah)"/>
<text x="14" y="582" class="e" text-anchor="middle" transform="rotate(-90 14 582)">ask a question</text>
<path d="M260,362 V442" fill="none" stroke="#b4b2aa" stroke-width="1.8"  marker-end="url(#ah)"/>
<text x="250" y="392" class="e" text-anchor="end">file + row 'uploaded'</text>
<path d="M300,492 H350" fill="none" stroke="#b4b2aa" stroke-width="1.8"  marker-end="url(#ah)"/>
<path d="M325,492 V408 H775 V442" fill="none" stroke="#b4b2aa" stroke-width="1.8"  marker-end="url(#ah)"/>
<text x="645" y="398" class="e" text-anchor="start">parsed text</text>
<path d="M260,542 V622" fill="none" stroke="#b4b2aa" stroke-width="1.8"  marker-end="url(#ah)"/>
<text x="272" y="588" class="e" text-anchor="start">preview + status</text>
<path d="M475,542 V622" fill="none" stroke="#b4b2aa" stroke-width="1.8"  marker-end="url(#ah)"/>
<text x="487" y="588" class="e" text-anchor="start">entities + relations</text>
<path d="M775,542 V622" fill="none" stroke="#b4b2aa" stroke-width="1.8"  marker-end="url(#ah)"/>
<text x="787" y="588" class="e" text-anchor="start">vectors</text>
<path d="M950,492 H900" fill="none" stroke="#b4b2aa" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ah)"/>
<path d="M260,722 V802" fill="none" stroke="#b4b2aa" stroke-width="1.8"  marker-end="url(#ah)"/>
<text x="272" y="768" class="e" text-anchor="start">catalog</text>
<path d="M475,722 V802" fill="none" stroke="#b4b2aa" stroke-width="1.8"  marker-end="url(#ah)"/>
<text x="487" y="768" class="e" text-anchor="start">node index</text>
<path d="M775,722 V802" fill="none" stroke="#b4b2aa" stroke-width="1.8"  marker-end="url(#ah)"/>
<text x="787" y="768" class="e" text-anchor="start">tenant matrix</text>
<path d="M300,852 H350" fill="none" stroke="#b4b2aa" stroke-width="1.8"  marker-end="url(#ah)"/>
<path d="M600,852 H650" fill="none" stroke="#b4b2aa" stroke-width="1.8"  marker-end="url(#ah)"/>
